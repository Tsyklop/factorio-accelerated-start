[mod-name]
AcceleratedStart=Accelerated Start

[mod-description]
AcceleratedStart=Start building sooner with equipped modular armor, 10 energy-free construction robots, and configurable robot speed. Inspired by FasterStart by magu5026.

[item-name]
accelerated-start-armor=Starter modular armor
accelerated-start-robot=Starter construction robot

[item-description]
accelerated-start-armor=A 6x6 equipment grid, supplied with a portable fission reactor, exoskeleton, personal roboport and night vision.
accelerated-start-robot=A construction robot that consumes no energy while moving or working. Flight speed is configurable in startup settings.

[entity-name]
accelerated-start-robot=Starter construction robot

[entity-description]
accelerated-start-robot=A construction robot that consumes no energy while moving or working. Flight speed is configurable in startup settings.

[mod-setting-name]
accelerated-start-robot-speed=Starter construction robot speed multiplier
accelerated-start-skip-intro=Skip freeplay intro
accelerated-start-disable-crashsite=Disable freeplay crashsite

[mod-setting-description]
accelerated-start-robot-speed=Multiplies this mod's construction robot flight speed by 1-100. Decimals are supported. 1 keeps the normal speed; 2 doubles it. Robot speed research still applies. Requires a restart.
accelerated-start-skip-intro=Asks the standard freeplay scenario to skip its introduction. Does not change custom scenarios.
accelerated-start-disable-crashsite=Asks the standard freeplay scenario not to create its starting crashsite. Intended for new games.

[accelerated-start]
command-help=Receive your starter kit if it has not already been granted. Each player receives it once per save.
kit-granted=Accelerated Start: your starter kit is ready.
already-received=Accelerated Start: you have already received your kit in this save.
no-character=Accelerated Start: a player character is required to receive the kit.
inventory-full=Accelerated Start: free an inventory slot and run /accelerated-start again. Your current armor has been kept.
