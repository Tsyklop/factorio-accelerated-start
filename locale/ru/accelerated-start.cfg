[mod-name]
AcceleratedStart=Ускоренный старт

[mod-description]
AcceleratedStart=Стартовая модульная броня со снаряжением, 10 строительных роботов без расхода энергии и настройка их скорости. Источник идеи — FasterStart от magu5026.

[item-name]
accelerated-start-armor=Стартовая модульная броня
accelerated-start-robot=Стартовый строительный робот

[item-description]
accelerated-start-armor=Сетка снаряжения 6x6 с переносным ядерным реактором, экзоскелетом, персональной робостанцией и прибором ночного видения.
accelerated-start-robot=Строительный робот без расхода энергии. Скорость полёта настраивается в параметрах запуска.

[entity-name]
accelerated-start-robot=Стартовый строительный робот

[entity-description]
accelerated-start-robot=Строительный робот без расхода энергии. Скорость полёта настраивается в параметрах запуска.

[mod-setting-name]
accelerated-start-robot-speed=Множитель скорости стартовых строительных роботов
accelerated-start-skip-intro=Пропустить вступление свободной игры
accelerated-start-disable-crashsite=Отключить место крушения в свободной игре

[mod-setting-description]
accelerated-start-robot-speed=Умножает скорость полёта роботов этого мода на 1–100. Допускаются дробные значения. 1 сохраняет обычную скорость, 2 удваивает её. Исследования скорости роботов продолжают действовать. Требуется перезапуск.
accelerated-start-skip-intro=Пропускает вступление стандартного сценария свободной игры. Не изменяет пользовательские сценарии.
accelerated-start-disable-crashsite=Отключает создание стартового места крушения стандартным сценарием свободной игры. Предназначено для новых игр.

[accelerated-start]
command-help=Получить стартовый набор, если он ещё не выдан. Набор выдаётся каждому игроку один раз за сохранение.
kit-granted=Ускоренный старт: ваш стартовый набор готов.
already-received=Ускоренный старт: вы уже получили набор в этом сохранении.
no-character=Ускоренный старт: для получения набора нужен персонаж.
inventory-full=Ускоренный старт: освободите ячейку инвентаря и повторите /accelerated-start. Надетая броня сохранена.
